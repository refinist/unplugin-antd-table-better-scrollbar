name: Unit Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CHROME_CHANNEL: chrome

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      test: ${{ steps.filter.outputs.test }}
    steps:
      - if: github.event_name == 'push'
        uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            test:
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE'
              - '!.vscode/**'

  ubuntu:
    name: unit-test (ubuntu-latest)
    needs: changes
    if: &run_tests ${{ !cancelled() && needs.changes.outputs.test != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps: &test_steps
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          cache: true
      - run: vp check
      - if: runner.os == 'Windows'
        run: vp test run
      - if: runner.os == 'Linux'
        run: vp test run --coverage --coverage.reporter=lcov
      - if: runner.os == 'Linux'
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: coverage/lcov.info
          fail_ci_if_error: true

  windows:
    name: unit-test (windows-latest)
    needs: changes
    if: *run_tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps: *test_steps
