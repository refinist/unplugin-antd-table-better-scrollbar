name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1
      - name: Generate GitHub Changelog
        run: vp exec changelogithub
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: vp pack
      - run: vp pm publish --no-git-checks --access public
